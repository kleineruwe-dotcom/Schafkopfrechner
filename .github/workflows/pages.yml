name: Seite veröffentlichen
# Baut die App und legt sie auf den Zweig gh-pages (von dort liefert GitHub Pages aus).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/scoring.test.cjs
      - run: python3 build_pages.py
      - name: Auf gh-pages veröffentlichen
        run: |
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Seite ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
