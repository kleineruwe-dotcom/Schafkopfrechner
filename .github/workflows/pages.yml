name: Seite veröffentlichen
# Baut die App und legt sie auf den Zweig gh-pages (von dort liefert GitHub Pages aus).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/scoring.test.cjs
      - run: python3 build_pages.py
      - name: Auf gh-pages veröffentlichen
        run: |
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Seite ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
      - name: Seite prüfen
        run: |
          for i in $(seq 1 30); do
            sleep 10
            c=$(curl -s -o /tmp/p.html -w '%{http_code}' "https://kleineruwe-dotcom.github.io/Schafkopfrechner/?v=${GITHUB_SHA::7}")
            if [ "$c" = 200 ] && grep -q Schafkopfrechner /tmp/p.html; then echo "online"; break; fi
          done
          curl -s -o /dev/null -w 'index %{http_code}\n' https://kleineruwe-dotcom.github.io/Schafkopfrechner/
          curl -s -o /dev/null -w 'manifest %{http_code}\n' https://kleineruwe-dotcom.github.io/Schafkopfrechner/manifest.webmanifest
          curl -s -o /dev/null -w 'kleinschreibung %{http_code}\n' https://kleineruwe-dotcom.github.io/schafkopfrechner/
